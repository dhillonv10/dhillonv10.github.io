<title>Myeloid Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: warm paper ground, white cards. Home is three columns (guide / matrix / places to start);
   detail views are a header card with one headline figure, a reading card, then full-width evidence cards. */
:root{
  --paper:#f6f3ec; --card:#ffffff; --ink:#1c1917; --ink-2:#57514a; --ink-3:#8c8478; --line:#e5ded2; --track:#efebe3; --hover:#f5f0e6;
  --accent:#6b2d5c; --accent-soft:#ecdde8; --accent-ink:#ffffff;
  --neg:#257de0; --pos:#dc3c3d; --div-mid:#ebe7df;
  --s-progenitor:#257de0; --s-myeloid:#f47230; --s-erythroid:#00b894; --s-megakaryocyte:#f2a600; --s-lymphoid:#ee7fac;
  --s-line:#008a17; --s-normal:#6a4ce2; --s-aml:#ec4647;
  --seq-0:#f1f5fb; --seq-1:#cce3fd; --seq-2:#9dc8f7; --seq-3:#6aabf1; --seq-4:#338ced; --seq-5:#2370cd; --seq-6:#1757ac; --seq-7:#0e3d7e;
  --crit:#c23536; --crit-soft:#f9dedd; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; --header-h:54px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#161311; --card:#201c19; --ink:#f0ebe4; --ink-2:#b8afa3; --ink-3:#81796e; --line:#38322c; --track:#2b2622; --hover:#2a2521;
  --accent:#e0a9cf; --accent-soft:#3e2a39; --accent-ink:#1c1917;
  --neg:#338ced; --pos:#eb6263; --div-mid:#34302b;
  --s-progenitor:#338ced; --s-myeloid:#e76624; --s-erythroid:#00a888; --s-megakaryocyte:#d28e05; --s-lymphoid:#e24d8b;
  --s-line:#0aac23; --s-normal:#9887ef; --s-aml:#eb6263;
  --seq-0:#1f2630; --seq-1:#0e3d7e; --seq-2:#1757ac; --seq-3:#2370cd; --seq-4:#338ced; --seq-5:#6aabf1; --seq-6:#9dc8f7; --seq-7:#cce3fd;
  --crit:#eb6263; --crit-soft:#47201f; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#161311; --card:#201c19; --ink:#f0ebe4; --ink-2:#b8afa3; --ink-3:#81796e; --line:#38322c; --track:#2b2622; --hover:#2a2521;
  --accent:#e0a9cf; --accent-soft:#3e2a39; --accent-ink:#1c1917;
  --neg:#338ced; --pos:#eb6263; --div-mid:#34302b;
  --s-progenitor:#338ced; --s-myeloid:#e76624; --s-erythroid:#00a888; --s-megakaryocyte:#d28e05; --s-lymphoid:#e24d8b;
  --s-line:#0aac23; --s-normal:#9887ef; --s-aml:#eb6263;
  --seq-0:#1f2630; --seq-1:#0e3d7e; --seq-2:#1757ac; --seq-3:#2370cd; --seq-4:#338ced; --seq-5:#6aabf1; --seq-6:#9dc8f7; --seq-7:#cce3fd;
  --crit:#eb6263; --crit-soft:#47201f; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)} .muted{color:var(--ink-3)} .num{font-variant-numeric:tabular-nums}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;min-height:var(--header-h);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand svg{flex:none}
.brand b{font-size:20px;font-weight:600;letter-spacing:.02em}
.brand span{color:var(--ink-3);font-size:15px;white-space:nowrap}
.search{position:relative;flex:1 1 260px;max-width:520px;min-width:0}
.search input{width:100%;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-family:var(--mono);font-size:12.5px}
.search input::placeholder{color:var(--ink-3)}
.suggest{position:absolute;left:0;right:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:20}
.suggest button{display:flex;gap:10px;align-items:baseline;width:100%;padding:7px 12px;border:0;background:none;text-align:left;cursor:pointer}
.suggest button:hover,.suggest button.on{background:var(--hover)}
.suggest small{color:var(--ink-3)}
nav.views{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
@media (max-width:620px){.brand span{display:none} nav.views{margin-left:0}}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill:hover{background:var(--hover)}
.pill[aria-pressed="true"],.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:24px;padding:0 10px;border:0;background:var(--track);font-family:var(--mono);font-size:12px;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.runchip{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--track);border-radius:6px;padding:3px 8px;white-space:nowrap}

main{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1480px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
h2.label,.label{font-size:13.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;margin:0}
.sublabel{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0}
.small{font-size:12.5px} .tiny{font-size:11.5px}
.disclaimer{color:var(--ink-3);font-size:12.5px;text-align:center;max-width:720px;margin:18px auto 0;border-top:1px solid var(--line);padding-top:16px}

/* home */
.home{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(240px,290px);gap:14px;align-items:start}
@media (max-width:1050px){.home{grid-template-columns:minmax(0,1fr)} .home .centre{order:-1}}
details.acc{border-top:1px solid var(--line)} details.acc:first-of-type{border-top:0}
details.acc summary{list-style:none;cursor:pointer;padding:9px 0;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::before{content:"";border:4px solid transparent;border-left:6px solid var(--accent);margin-left:2px;transition:transform .15s}
details.acc[open] summary::before{transform:rotate(90deg) translate(2px,-2px)}
details.acc[open] summary{color:var(--accent)}
details.acc p{margin:0 0 12px;color:var(--ink-2);font-size:13px}
.centre{padding:10px 4px;text-align:center;min-width:0}
.centre h1{font-size:18px;font-weight:600;margin:14px 0 4px;text-wrap:balance}
.centre .lead{color:var(--ink-3);font-size:14.5px;margin:0 0 14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.matrix-wrap{overflow-x:auto;margin:22px auto 0;max-width:100%}
table.matrix{border-collapse:separate;border-spacing:3px;margin:0 auto}
table.matrix th{font-weight:500;font-size:12px;color:var(--ink-2);padding:2px 6px;white-space:nowrap}
table.matrix th.grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:2px solid var(--line);padding-bottom:3px}
table.matrix th.row{text-align:right;font-weight:600;color:var(--ink);font-size:13px}
table.matrix th.tier{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:10px}
table.matrix th.col.rot{height:110px;vertical-align:bottom;padding:0}
table.matrix th.col.rot span{display:block;transform:rotate(-55deg);transform-origin:left bottom;width:22px;white-space:nowrap;margin-left:12px}
table.matrix th.grp{padding-left:0;padding-right:0}
.cell{display:block;border:0;border-radius:4px;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.cell:hover{outline:2px solid var(--ink);outline-offset:1px}
.cell.na{background:var(--track);cursor:default}
.legend{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-2);font-size:12px;margin-top:16px}
.legend i{display:block;width:140px;height:8px;border-radius:4px}
.starts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.starts a{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 6px;border-radius:8px;text-decoration:none}
.starts a:hover{background:var(--hover)}
.starts .n{width:22px;height:22px;border-radius:50%;background:var(--track);color:var(--ink-3);font-size:11.5px;display:grid;place-items:center;margin-top:2px}
.starts b{font-weight:600} .starts .tag{color:var(--ink-3);font-size:12px;margin-left:6px}
.starts .sub{display:block;color:var(--ink-2);font-size:13px}

/* detail header */
.head{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.head h1{font-size:23px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.head h1 small{font-size:16px;font-weight:400;color:var(--ink-2)}
.meta{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 0;margin:4px 0 8px}
.meta span+span::before{content:"|";color:var(--line);margin:0 12px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.badge.crit{background:var(--crit-soft);color:var(--crit)} .badge.plain{background:var(--track);color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:5px;background:var(--track);color:var(--ink-2);text-decoration:none}
.chip:hover{background:var(--line)}
.figure{text-align:center;min-width:170px}
.figure .cap{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.figure .big{font-size:46px;font-weight:600;line-height:1.1;color:var(--accent)}
.figure .big small{font-size:18px;font-weight:500;margin-left:4px}
.figure select{margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px 6px;font-size:12.5px;max-width:100%}
.reading{border-left:3px solid var(--accent)}
.reading .headline{font-weight:600;font-size:14.5px;margin:10px 0 8px;max-width:110ch}
.reading p{margin:0 0 10px;color:var(--ink-2);font-size:13px;max-width:120ch}
.reading ul{margin:6px 0 0;padding-left:18px;font-size:13px;columns:2 320px;column-gap:40px}
.bar-row{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.bar-row .lab{font-weight:600;font-size:13px}
.browser{position:relative}
.browser canvas{display:block;width:100%}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:8px 10px;font-size:12px;max-width:280px}
.tip .t{font-family:var(--mono);color:var(--ink-2);margin-bottom:4px}
.tip .r{display:flex;gap:8px;align-items:center;justify-content:space-between}
.tip .r span:first-child{display:flex;gap:6px;align-items:center}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.tip .r.on{font-weight:600}

/* evidence rows: name | bars | bars */
.rows{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2fr) minmax(0,2fr);gap:8px 22px;align-items:center}
.rows .hd{font-size:11.5px;color:var(--ink-3);text-align:center}
.rows .nm{font-size:13px;min-width:0} .rows .nm small{display:block;color:var(--ink-3);font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
.bars{display:flex;flex-direction:column;gap:2px;background:var(--track);border-radius:3px;padding:2px 0;min-width:0}
.bars span{display:block;height:5px;border-radius:0 3px 3px 0;min-width:0}
.bars span.none{background:none}
.div-bar{position:relative;height:12px;background:var(--track);border-radius:3px}
.div-bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.div-bar i{position:absolute;top:0;bottom:0;border-radius:2px}
@media (max-width:700px){.rows{grid-template-columns:minmax(0,1fr)} .rows .hd{display:none}}
.keys{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.keys span{display:inline-flex;gap:6px;align-items:center}
.keys i{width:9px;height:9px;border-radius:2px;display:inline-block}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl td.v{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap} table.tbl th.v{text-align:right}
table.tbl tr.click{cursor:pointer} table.tbl tr.click:hover td{background:var(--hover)}
.scroll-x{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:10px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
svg text{font-family:var(--sans)}
.note{background:var(--track);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="Myeloid Atlas home">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M9 12c2-4 9-5 12-1 2 3 0 8-4 9-3 1-7-1-8-4-.5-1.400-.6-2.800 0-4z" fill="var(--accent)" opacity=".85"/><circle cx="19.500" cy="12.500" r="1.700" fill="var(--card)"/></svg>
    <b>Myeloid Atlas</b><span>AML/MDS regulatory predictions</span></a>
  <div class="search"><input id="q" type="search" autocomplete="off" placeholder="Search gene, region or clock CpG (GATA2, MECOM, cg…)" aria-label="Search the atlas"><div class="suggest" id="suggest" hidden></div></div>
  <nav class="views" id="nav" aria-label="Views"></nav>
</div></header>
<main id="app"><div class="empty">Loading the atlas…</div></main>
<div class="tip" id="tip" hidden></div>

<script>
'use strict';
/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtInt = n => Math.round(n).toLocaleString('en-US');
const fmt = (v, d = 2) => v == null ? '–' : (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(d));
const signed = (v, d = 2) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const kbText = k => (k >= 0 ? '+' : '−') + Math.abs(k).toFixed(1) + ' kb';
function b64u8(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function hexRgb(x) { x = x.replace('#', ''); if (x.length === 3) x = [...x].map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function seqColor(t) { if (t == null || isNaN(t)) return css('--track'); t = Math.max(0, Math.min(1, t)) * 7; const i = Math.min(6, Math.floor(t)); return mix(css('--seq-' + i), css('--seq-' + (i + 1)), t - i); }
function divColor(t) { if (t == null || isNaN(t)) return css('--track'); t = Math.max(-1, Math.min(1, t)); return mix(css('--div-mid'), css(t < 0 ? '--neg' : '--pos'), Math.pow(Math.abs(t), .8)); }
function lum(rgb) { const m = rgb.match(/\d+/g).map(Number); return (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) / 255; }
const GROUP_VAR = { progenitor: '--s-progenitor', myeloid: '--s-myeloid', erythroid: '--s-erythroid', megakaryocyte: '--s-megakaryocyte', lymphoid: '--s-lymphoid',
  'cell line': '--s-line', AML: '--s-aml', 'normal (Seq-Well)': '--s-normal' };
const GROUP_NAME = { progenitor: 'Progenitors', myeloid: 'Myeloid', erythroid: 'Erythroid', megakaryocyte: 'Megakaryocyte', lymphoid: 'Lymphoid', 'cell line': 'Cell lines',
  AML: 'AML cells', 'normal (Seq-Well)': 'Matched normal cells' };
const stateColor = s => css(GROUP_VAR[s.group] || '--s-progenitor');
const GROUP_SHORT = { progenitor: 'Prog', myeloid: 'Myel', erythroid: 'Ery', megakaryocyte: 'Mk', lymphoid: 'Lym', 'cell line': 'Lines', AML: 'AML', 'normal (Seq-Well)': 'Norm' };
const TIER_NAME = { predisposition: 'Germline predisposition', drivers: 'Drivers and regulators', lsc17: 'LSC17 signature', ch_gwas: 'Clonal hematopoiesis loci' };
const TRACK_NAME = { rna: 'RNA', acc: 'Accessibility', H3K27ac: 'H3K27ac', H3K4me1: 'H3K4me1', H3K4me3: 'H3K4me3', H3K27me3: 'H3K27me3', H3K36me3: 'H3K36me3', H3K9me3: 'H3K9me3',
  meth: 'CpG methylation', grad: 'Sequence attribution' };
const MODE_TEXT = { observed: 'measured in training', supported: 'imputed from a measured assay', exploratory: 'imputed, not benchmarked', cells: 'imputed from the cells supplied', unknown: 'unknown' };

const A = { atlas: null, files: {}, ui: { metric: 'expr', win: 'wide', marks: false, readout: 'expr', clockColor: 'aml' } };
A.ready = {};
function getFile(name) { if (!A.files[name]) A.files[name] = fetch('data/' + name).then(r => { if (!r.ok) throw new Error(name + ': ' + r.status); return r.json(); }).then(j => (A.ready[name] = j)); return A.files[name]; }
/* Renders with a data file: at once when it is already loaded (keeps scroll position on re-render), else after fetching it. */
function withFile(name, app, label, cb) {
  if (A.ready[name]) { cb(A.ready[name]); return; }
  app.replaceChildren(h('div', { class: 'empty' }, 'Loading ' + label + '…'));
  getFile(name).then(cb).catch(e => app.replaceChildren(h('div', { class: 'card empty' }, 'Could not load ' + label + ': ' + e.message)));
}
const tip = $('#tip');
function showTip(ev, node) { tip.replaceChildren(node); tip.hidden = false; const w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + hh > innerHeight - 8) y = ev.clientY - hh - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px'; }

/* ---------- router and boot ---------- */
