title: Vik Dhillon
author: Vikram Dhillon
description: Personal Blog
url: "https://www.opsbug.com"
baseurl: ""
lang: en

github_username: dhillonv10
twitter_username: opsbug

theme: null
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

permalink: /posts/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
