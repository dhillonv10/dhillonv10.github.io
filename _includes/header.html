<header class="site-header">
  <a class="skip" href="#main-content">Skip to content</a>
  <div class="site-header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/posts/' | relative_url }}"{% if page.url == '/posts/' %} class="active"{% endif %}>Posts</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="active"{% endif %}>Tags</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
      <a href="{{ '/search/' | relative_url }}" aria-label="Search"{% if page.url == '/search/' %} class="active"{% endif %}>Search</a>
      <button id="theme-btn" type="button" title="Toggle light &amp; dark" aria-label="Toggle theme">◐</button>
    </nav>
  </div>
</header>
